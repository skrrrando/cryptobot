name: Cryptobot hourly scan

on:
  schedule:
    # GitHub Actions cron is always UTC. 0 * * * * = every hour, on the hour, UTC.
    - cron: "0 * * * *"
  workflow_dispatch:   # lets you click "Run workflow" manually in the Actions tab
    inputs:
      killswitch_reset:
        description: "Lähtesta kill-switch selle käivitusega"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # needed so the workflow can commit the updated data/dashboard back

# Without this, an overlapping trigger (a schedule firing twice, or a manual
# "Run workflow" click landing mid-run) can execute two instances of this
# job in parallel. Each independently reads state.json, makes its own
# trading decisions, and appends its own equity snapshot - and because the
# retry loop below resolves push conflicts with a plain git rebase (a
# line-based text patch, not JSON-aware), BOTH runs' appended entries can
# survive the merge instead of one properly overwriting the other. That
# produced a real, confirmed artifact: two balance_history points a
# fraction of a second apart with different values, which briefly inflated
# the dashboard's max-drawdown figure. Queuing (not canceling) overlapping
# runs means every trigger still executes in full - one at a time - so no
# stop-loss check or followup resolution is ever skipped or duplicated.
concurrency:
  group: cryptobot-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cryptobot scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILLSWITCH_RESET: ${{ (github.event.inputs.killswitch_reset == 'true') && '1' || '' }}
        run: python3 fetch_and_run.py

      - name: Commit updated state + dashboard
        run: |
          git config user.name "cryptobot"
          git config user.email "actions@users.noreply.github.com"
          # index.html deliberately NOT staged here any more: it is now the
          # hand-written landing page, not this sleeve's output (see
          # engine.INDEX_PATH). This sleeve only owns dashboard.html.
          git add data/ dashboard.html
          git diff --staged --quiet || git commit -m "Hourly scan update [skip ci]"
          # The remote may have moved since checkout (e.g. you pushed something
          # from GitHub Desktop, or a previous run's push landed just before this
          # one). Rebase our one commit on top of whatever is there now instead
          # of failing outright, then retry the push a couple of times in case
          # of a race against another run.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
