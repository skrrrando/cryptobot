<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070d">
<title>Cryptobot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="landing">
  <div class="landing-head">
    <h1>Cryptobot</h1>
    <div class="updated" id="updated">&nbsp;</div>
  </div>

  <div class="balances">
    <a class="balance-card" href="cryptobot.html" style="--card-glow: rgba(124,127,242,0.16)">
      <div class="label">Bot</div>
      <div class="amount" id="bot-amount">—</div>
      <div class="week" id="bot-week"><span class="week-label">7 päeva</span><span>—</span></div>
      <div class="enter">Vaata <span class="arrow">&rarr;</span></div>
    </a>

    <a class="balance-card" href="moonshot.html" style="--card-glow: rgba(34,211,238,0.16)">
      <div class="label">Moonshot</div>
      <div class="amount" id="moon-amount">—</div>
      <div class="week" id="moon-week"><span class="week-label">7 päeva</span><span>—</span></div>
      <div class="enter">Vaata <span class="arrow">&rarr;</span></div>
    </a>
  </div>
</div>

<script>
const fmtUsd = (n) => (n === null || n === undefined || isNaN(n)) ? '—'
  : (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';

async function fetchJson(path, fallback) {
  try {
    const res = await fetch(path + '?t=' + Date.now());
    if (!res.ok) return fallback;
    return await res.json();
  } catch (e) { return fallback; }
}

// Percentage change over the trailing 7 days, from the hourly net-worth
// snapshots each scanner writes. Returns null rather than a made-up number
// when there isn't a data point old enough to compare against yet - a fresh
// deploy has no week of history and shouldn't pretend otherwise.
function weekChangePct(history, currentNetWorth) {
  if (!Array.isArray(history) || history.length === 0 || currentNetWorth == null) return null;
  const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
  let baseline = null;
  for (const point of history) {
    const t = new Date(point.ts).getTime();
    if (isNaN(t)) continue;
    if (t <= weekAgo) baseline = point;      // keep walking forward to the newest point still older than a week
    else { if (baseline === null) baseline = point; break; }
  }
  if (!baseline || !baseline.net_worth) return null;
  return (currentNetWorth / baseline.net_worth - 1) * 100;
}

function paint(prefix, netWorth, startingBalance, history) {
  const amountEl = document.getElementById(prefix + '-amount');
  const weekEl = document.getElementById(prefix + '-week');

  if (netWorth == null) {
    amountEl.textContent = '—';
    weekEl.innerHTML = '<span class="week-label">7 päeva</span><span>ootab andmeid</span>';
    weekEl.className = 'week flat';
    return;
  }

  amountEl.textContent = fmtUsd(netWorth);
  // Colour the balance by whether the account is up or down overall, so the
  // number itself carries the state without any extra label.
  const vsStart = startingBalance ? netWorth - startingBalance : 0;
  amountEl.className = 'amount ' + (vsStart > 0 ? 'good' : vsStart < 0 ? 'bad' : '');

  const wk = weekChangePct(history, netWorth);
  if (wk === null) {
    weekEl.innerHTML = '<span class="week-label">7 päeva</span><span>vähe ajalugu</span>';
    weekEl.className = 'week flat';
  } else {
    weekEl.innerHTML = '<span class="week-label">7 päeva</span><span>' + fmtPct(wk) + '</span>';
    weekEl.className = 'week ' + (wk > 0 ? 'good' : wk < 0 ? 'bad' : 'flat');
  }
}

async function main() {
  const [botPortfolio, botHistory, moonDash, moonHistory] = await Promise.all([
    fetchJson('data/memecoin_portfolio.json', null),
    fetchJson('data/memecoin_networth_history.json', []),
    fetchJson('data/pumpfun_dashboard.json', null),
    fetchJson('data/pumpfun_networth_history.json', []),
  ]);

  // The bot sleeve has no pre-computed net worth file, but its hourly history
  // does - so use the newest snapshot rather than re-valuing every position
  // in the browser (which would need a live price call per holding).
  let botNet = null;
  if (Array.isArray(botHistory) && botHistory.length) {
    botNet = botHistory[botHistory.length - 1].net_worth;
  } else if (botPortfolio) {
    // Fall back to cost basis until the first snapshot lands.
    botNet = botPortfolio.balance
      + Object.values(botPortfolio.positions || {}).reduce((s, p) => s + (p.amount_usd || 0), 0);
  }
  paint('bot', botNet, 1000, botHistory);

  const moonNet = moonDash ? moonDash.net_worth : null;
  paint('moon', moonNet, moonDash ? moonDash.starting_balance : 1000, moonHistory);

  const stamp = moonDash?.timestamp
    || (botHistory.length ? botHistory[botHistory.length - 1].ts : null);
  document.getElementById('updated').textContent = stamp
    ? new Date(stamp).toLocaleString('et-EE', { dateStyle: 'medium', timeStyle: 'short' })
    : '';
}

main();
setInterval(main, 60000);
</script>
</body>
</html>
